name: Reproduce Playwright types issue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.os }} / ${{ matrix.scenario }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        scenario: [baseline, workaround]
    env:
      # pnpm otherwise disables the global virtual store in CI.
      PNPM_CONFIG_CI: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Keep the pnpm store outside the checkout
        # Ancestor resolution hides the bug if the store is inside the project.
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the original bug
        if: matrix.scenario == 'baseline'
        run: pnpm repro

      - name: Apply the optional-peer workaround
        if: matrix.scenario == 'workaround'
        run: |
          cp workaround.pnpmfile.mjs .pnpmfile.mjs
          pnpm install --no-frozen-lockfile --force

      - name: Verify restored Playwright types
        if: matrix.scenario == 'workaround'
        run: pnpm repro:fixed
